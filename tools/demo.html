<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>easy-ck · demo</title>
<link rel="stylesheet" href="../html/style.css">
</head>
<body>
<!-- Demo de la interfaz para ajustar el diseño sin levantar el servidor.
     Carga el html/style.css y el html/app.js de verdad y les envía datos de ejemplo.

     El navegador no deja leer archivos con file://, así que se sirve la carpeta:
       python3 -m http.server 8000
     y se abre http://localhost:8000/tools/demo.html -->
<div id="host"></div>

<script>
// Carga el cuerpo real de html/index.html dentro de esta página.
fetch('../html/index.html')
    .then((response) => response.text())
    .then((html) => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        document.getElementById('host').innerHTML = doc.getElementById('app').outerHTML;
        document.getElementById('app').classList.add('hidden');

        const script = document.createElement('script');
        script.src = '../html/app.js';
        script.onload = start;
        document.body.appendChild(script);
    });

const LOCALE = {
    title: 'Character Kill', subtitle: 'Muerte permanente de personaje',
    tab_online: 'En línea', tab_all: 'Todos', search: 'Buscar por nombre, ID o citizenid...',
    search_all: 'Buscar por nombre o citizenid...', load_more: 'Cargar más',
    no_players: 'No hay jugadores conectados', no_results: 'Ningún personaje coincide con la búsqueda',
    no_char: 'Sin personaje', empty_title: 'Selecciona un jugador',
    empty_text: 'Elige a alguien de la lista o busca un personaje desconectado para ver todo lo que se va a borrar.',
    loading: 'Cargando...', data: 'Datos que se van a borrar', select_all: 'Marcar todo',
    select_none: 'Desmarcar todo', locked: 'Siempre se borra', rows: 'filas', row: 'fila',
    empty_table: 'Sin datos', more_rows: 'y %s filas más', soft_delete: 'Se marcará como borrado',
    total: 'Total seleccionado', reason: 'Motivo del CK', reason_ph: 'Ej: muerte en rol durante un atraco',
    reason_req: 'Obligatorio', kill: 'Mantén pulsado para hacer CK', killing: 'Ejecutando CK...',
    close: 'Cerrar', status_online: 'En línea', status_offline: 'Desconectado',
    nothing_selected: 'No has seleccionado ninguna tabla.',
    detected: 'detectada', no_key: 'sin clave primaria: solo entera',
    showing: 'mostrando %s de %s', load_rows: 'Cargar todas las filas',
    loading_rows: 'Cargando filas...', rows_selected: '%s de %s filas',
    irreversible: 'Esta acción borra los datos de la base de datos. Solo se puede revertir a mano desde easy_ck_log.',
    f_name: 'Nombre', f_birth: 'Nacimiento', f_phone: 'Teléfono', f_job: 'Trabajo',
    f_gang: 'Banda', f_cash: 'Efectivo', f_bank: 'Banco', f_crypto: 'Cripto', f_last_seen: 'Último acceso',
};

function rows(count, make) {
    const out = [];
    for (let i = 1; i <= count; i++) out.push({ id: String(i), cells: make(i) });
    return out;
}

function table(name, label, count, columns, sample, extra) {
    return Object.assign({
        table: name, label, count, columns, rows: sample, key: 'id',
        links: ['citizenid'], mode: 'delete', locked: false, discovered: false, selected: true,
    }, extra || {});
}

function start() {
    window.postMessage({ action: 'open', data: {
        locale: LOCALE, framework: 'qbox', requireReason: false,
        players: [
            { id: 1, steam: 'jaiminator21', charId: 'ABC12345', name: 'Juan Pérez', job: 'Policía' },
            { id: 5, steam: 'Piquito2310', charId: 'XYZ98765', name: 'Marta Ruiz', job: 'Mecánico' },
            { id: 9, steam: 'goan311', charId: null, name: null, job: null },
        ],
    } }, '*');

    setTimeout(() => window.postMessage({ action: 'preview', data: {
        charId: 'ABC12345', name: 'Juan Pérez', online: 1, framework: 'qbox',
        summary: [
            { key: 'f_name', value: 'Juan Pérez' }, { key: 'f_birth', value: '1994-03-11' },
            { key: 'f_phone', value: '555-0193' }, { key: 'f_job', value: 'Policía - Cadete' },
            { key: 'f_cash', value: '$4.210' }, { key: 'f_bank', value: '$128.940' },
            { key: 'f_crypto', value: '3' }, { key: 'f_last_seen', value: '2026-09-19 22:41:02' },
        ],
        tables: [
            table('players', 'Personaje', 1, ['name', 'money'],
                [{ id: 'ABC12345', cells: ['jaiminator21', '{"cash":4210,"bank":128940}'] }],
                { locked: true, key: 'citizenid' }),
            table('player_groups', 'Trabajos y bandas', 3, ['group', 'type', 'grade'],
                rows(3, (i) => [['police', 'vagos', 'unemployed'][i - 1], i === 2 ? 'gang' : 'job', String(i)]),
                { key: null }),
            table('player_vehicles', 'Vehículos', 6, ['plate', 'vehicle', 'garage', 'state'],
                rows(6, (i) => [`ABC 12${i}`, ['sultan', 'kuruma', 'dominator', 'blista', 'faggio', 'sentinel'][i - 1], 'legionsquare', '1']),
                { open: true }),
            table('playerskins', 'Apariencia', 1, ['model'], rows(1, () => ['mp_m_freemode_01'])),
            table('player_outfits', 'Outfits', 4, ['outfitname', 'model'],
                rows(4, (i) => [['Uniforme', 'Playa', 'Traje', 'Gimnasio'][i - 1], 'mp_m_freemode_01'])),
            table('properties', 'Propiedades', 2, ['name'], rows(2, (i) => [['Mirror Park 4', 'Trastero'][i - 1]]),
                { links: ['owner'] }),
            table('twitter_accounts', 'twitter_accounts', 2, ['username', 'created'],
                rows(2, (i) => [['@juanp', '@jp_alt'][i - 1], '2026-04-0' + i]), { discovered: true }),
            table('npwd_messages', 'npwd_messages', 312, ['body', 'date'],
                rows(25, (i) => ['nos vemos en el taller', '2026-09-1' + (i % 9)]),
                { discovered: true, links: ['sender_citizenid', 'receiver_citizenid'] }),
            table('phone_messages', 'Mensajes', 184, ['number', 'message'],
                rows(25, (i) => ['555-010' + i, 'a las 22:00']), { selected: false }),
            table('phone_invoices', 'Facturas', 9, ['amount', 'society'], rows(9, (i) => [String(i * 120), 'mechanic'])),
        ],
    } }, '*'), 60);
}
</script>
</body>
</html>
